name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # 仅保留 ubuntu：本包为纯 R 包，ubuntu 已完整验证；
          # mac/win 依赖 GitHub 不稳定的 release-asset CDN 下载 R/rig 二进制，
          # 曾多次因 504 失败（同属基础设施故障，非包缺陷）。
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # 本包不上 CRAN：去掉默认的 --as-cran（其强制的
          # “CRAN incoming feasibility” 联网检查在 CI 环境下会失败）。
          # vignette 已在 inst/doc 预构建并提交仓库，CI 跳过 vignette 构建，
          # 避免依赖 GitHub 上不稳定的 Pandoc 下载（曾因 504 导致 mac/win 失败）。
          args: 'c("--no-manual", "--no-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
